<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="white"/>

  <!-- Title -->
  <text x="600" y="50" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">
    Stakeholder Tension Grid (Variant RE-027)
  </text>

  <!-- Stakeholder 1: Access Administrator (TOP LEFT) -->
  <circle cx="250" cy="200" r="90" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
  <text x="250" y="190" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e40af">Access</text>
  <text x="250" y="210" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e40af">Administrator</text>
  <text x="250" y="225" font-size="13" text-anchor="middle" fill="#1e3a8a">(Focus Stakeholder)</text>

  <!-- Stakeholder 2: Data Subject (TOP RIGHT) -->
  <circle cx="950" cy="200" r="90" fill="#ede9fe" stroke="#7c3aed" stroke-width="4"/>
  <text x="950" y="190" font-size="15" font-weight="bold" text-anchor="middle" fill="#6b21a8">Data Subject /</text>
  <text x="950" y="210" font-size="15" font-weight="bold" text-anchor="middle" fill="#6b21a8">End User</text>

  <!-- Stakeholder 3: SecOps & Auditor (BOTTOM LEFT) -->
  <circle cx="250" cy="550" r="90" fill="#d1fae5" stroke="#059669" stroke-width="4"/>
  <text x="250" y="540" font-size="15" font-weight="bold" text-anchor="middle" fill="#047857">SecOps &</text>
  <text x="250" y="560" font-size="15" font-weight="bold" text-anchor="middle" fill="#047857">Compliance</text>
  <text x="250" y="580" font-size="15" font-weight="bold" text-anchor="middle" fill="#047857">Auditor</text>

  <!-- Stakeholder 4: DPO / Legal (BOTTOM RIGHT) -->
  <circle cx="950" cy="550" r="90" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/>
  <text x="950" y="540" font-size="15" font-weight="bold" text-anchor="middle" fill="#991b1b">DPO / Legal</text>
  <text x="950" y="560" font-size="15" font-weight="bold" text-anchor="middle" fill="#991b1b">Counsel</text>

  <!-- CONFLICT-01: SecOps vs DPO (HORIZONTAL BOTTOM) -->
  <line x1="340" y1="550" x2="860" y2="550" stroke="#dc2626" stroke-width="4" stroke-dasharray="12,6"/>
  <rect x="490" y="570" width="220" height="80" rx="10" fill="white" stroke="#dc2626" stroke-width="2"/>
  <text x="600" y="595" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc2626">CONFLICT-01</text>
  <text x="600" y="615" font-size="12" text-anchor="middle">41-day audit retention</text>
  <text x="600" y="633" font-size="12" text-anchor="middle">vs zero direct PII</text>
  <text x="600" y="651" font-size="12" text-anchor="middle">exposure requirement</text>

  <!-- CONFLICT-02: Access Admin vs Data Subject (HORIZONTAL TOP) -->
  <line x1="340" y1="200" x2="860" y2="200" stroke="#ea580c" stroke-width="4" stroke-dasharray="12,6"/>
  <rect x="490" y="110" width="220" height="70" rx="10" fill="white" stroke="#ea580c" stroke-width="2"/>
  <text x="600" y="135" font-size="14" font-weight="bold" text-anchor="middle" fill="#ea580c">CONFLICT-02</text>
  <text x="600" y="155" font-size="12" text-anchor="middle">20-hour SLA window</text>
  <text x="600" y="173" font-size="12" text-anchor="middle">vs 302 concurrent load</text>

  <!-- CONFLICT-03: Access Admin vs SecOps (VERTICAL LEFT) -->
  <line x1="250" y1="290" x2="250" y2="460" stroke="#7c3aed" stroke-width="4" stroke-dasharray="12,6"/>
  <rect x="60" y="340" width="180" height="80" rx="10" fill="white" stroke="#7c3aed" stroke-width="2"/>
  <text x="150" y="365" font-size="14" font-weight="bold" text-anchor="middle" fill="#7c3aed">CONFLICT-03</text>
  <text x="150" y="385" font-size="12" text-anchor="middle">Instant access</text>
  <text x="150" y="403" font-size="12" text-anchor="middle">revocation vs audit</text>
  <text x="150" y="421" font-size="12" text-anchor="middle">logging latency</text>

  <!-- Outcomes Box (CENTER) -->
  <rect x="450" y="300" width="300" height="150" rx="15" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/>
  <text x="600" y="330" font-size="17" font-weight="bold" text-anchor="middle" fill="#1f2937">
    Measurable Outcomes
  </text>

  <text x="600" y="360" font-size="13" text-anchor="middle" fill="#334155">OUTCOME-01:</text>
  <text x="600" y="378" font-size="12" text-anchor="middle" fill="#475569">100% requests ≤ 20h</text>

  <text x="600" y="400" font-size="13" text-anchor="middle" fill="#334155">OUTCOME-02:</text>
  <text x="600" y="418" font-size="12" text-anchor="middle" fill="#475569">100% compliance, 41-day, 0% PII</text>

  <text x="600" y="440" font-size="13" text-anchor="middle" fill="#334155">OUTCOME-03:</text>
  <text x="600" y="458" font-size="12" text-anchor="middle" fill="#475569">Error rate &lt; 0.1% @ 302 users</text>

  <!-- Variant Parameters Box -->
  <rect x="300" y="710" width="600" height="60" rx="10" fill="#e5e7eb" stroke="#64748b" stroke-width="2"/>
  <text x="600" y="735" font-size="15" font-weight="bold" text-anchor="middle">Variant RE-027 Parameters</text>
  <text x="600" y="758" font-size="14" text-anchor="middle">302 concurrent users | 41-day audit retention | 20-hour response window</text>

  <!-- Key principle -->
  <text x="600" y="90" font-size="13" text-anchor="middle" font-style="italic" fill="#64748b">
    4 distinct stakeholder parties with 3 core architectural tensions requiring resolution
  </text>
</svg>