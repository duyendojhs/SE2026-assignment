<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="white"/>

  <!-- Title -->
  <text x="600" y="60" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">
    1-Week AI-Augmented Software Process (Variant RE-027)
  </text>

  <!-- Day boxes -->
  <g id="days">
    <!-- Day 1 -->
    <rect x="50" y="120" width="140" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="120" y="155" font-size="14" font-weight="bold" text-anchor="middle">Day 1</text>
    <text x="120" y="175" font-size="12" text-anchor="middle">Inception</text>
    <text x="120" y="230" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="bold">GATE-01</text>

    <!-- Day 2 -->
    <rect x="210" y="120" width="140" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="280" y="155" font-size="14" font-weight="bold" text-anchor="middle">Day 2</text>
    <text x="280" y="175" font-size="12" text-anchor="middle">Behavioral Spec</text>
    <text x="280" y="230" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="bold">GATE-02</text>

    <!-- Day 3 -->
    <rect x="370" y="120" width="140" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="440" y="155" font-size="14" font-weight="bold" text-anchor="middle">Day 3</text>
    <text x="440" y="175" font-size="12" text-anchor="middle">Quality Scenarios</text>
    <text x="440" y="230" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="bold">GATE-03</text>

    <!-- Day 4 -->
    <rect x="530" y="120" width="140" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="600" y="155" font-size="14" font-weight="bold" text-anchor="middle">Day 4</text>
    <text x="600" y="175" font-size="12" text-anchor="middle">Risk Analysis</text>

    <!-- Day 5 -->
    <rect x="690" y="120" width="140" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="760" y="155" font-size="14" font-weight="bold" text-anchor="middle">Day 5</text>
    <text x="760" y="175" font-size="12" text-anchor="middle">Implementation</text>
    <text x="760" y="230" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="bold">GATE-04</text>

    <!-- Day 6 -->
    <rect x="850" y="120" width="140" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="920" y="155" font-size="14" font-weight="bold" text-anchor="middle">Day 6</text>
    <text x="920" y="175" font-size="12" text-anchor="middle">Traceability</text>
    <text x="920" y="230" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="bold">GATE-05</text>

    <!-- Day 7 -->
    <rect x="1010" y="120" width="140" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="1080" y="155" font-size="14" font-weight="bold" text-anchor="middle">Day 7</text>
    <text x="1080" y="175" font-size="12" text-anchor="middle">Certification</text>
    <text x="1080" y="230" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="bold">GATE-05 (Final)</text>
  </g>

  <!-- Arrows between days -->
  <line x1="190" y1="160" x2="210" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="350" y1="160" x2="370" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="510" y1="160" x2="530" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="670" y1="160" x2="690" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="830" y1="160" x2="850" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="990" y1="160" x2="1010" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Inner Loop -->
  <rect x="100" y="300" width="1000" height="100" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="600" y="330" font-size="16" font-weight="bold" text-anchor="middle">Inner Verification Loop (Hours)</text>
  <text x="600" y="360" font-size="14" text-anchor="middle">AI Draft → Deterministic Linting → Property-Based Testing → Human Audit Gate</text>
  <text x="600" y="385" font-size="13" text-anchor="middle" font-style="italic">Minutes to hours per artifact; Never produces deployable artifacts</text>

  <!-- Outer Loop -->
  <rect x="100" y="420" width="1000" height="100" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="600" y="450" font-size="16" font-weight="bold" text-anchor="middle">Outer Stakeholder Validation Loop (Days)</text>
  <text x="600" y="480" font-size="14" text-anchor="middle">Load Test Execution (TC-PERF-01, 302 users) → Compliance Review (DPO/SecOps)</text>
  <text x="600" y="505" font-size="14" text-anchor="middle">→ SLA Drill (TC-SLA-01) → Release Certification (GATE-05 final)</text>

  <!-- Trade-offs -->
  <text x="600" y="560" font-size="16" font-weight="bold" text-anchor="middle">Engineering Trade-offs</text>
  <text x="600" y="590" font-size="13" text-anchor="middle">Trade-off 1: Velocity vs Verification Depth → Verification wins (20h SLA non-negotiable)</text>
  <text x="600" y="615" font-size="13" text-anchor="middle">Trade-off 2: Full Automation vs Human Audit Gates → Human gates win (legal accountability)</text>
  <text x="600" y="640" font-size="13" text-anchor="middle">Trade-off 3: Agile Flexibility vs Rigid SLA → Rigid SLA wins (regulatory compliance)</text>

  <!-- Variant parameters -->
  <rect x="300" y="680" width="600" height="60" rx="10" fill="#e5e7eb" stroke="#64748b" stroke-width="2"/>
  <text x="600" y="710" font-size="15" font-weight="bold" text-anchor="middle">Variant RE-027 Constraints</text>
  <text x="600" y="733" font-size="14" text-anchor="middle">302 concurrent users | 41-day audit retention | 20-hour SLA window</text>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#64748b"/>
    </marker>
  </defs>
</svg>