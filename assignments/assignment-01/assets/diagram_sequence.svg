<svg width="1200" height="900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="900" fill="white"/>

  <!-- Title -->
  <text x="600" y="40" font-size="26" font-weight="bold" text-anchor="middle" fill="#1f2937">
    UML Sequence: Concurrent Privilege Revocation Under Peak Load (302 Users)
  </text>
  <text x="600" y="70" font-size="16" text-anchor="middle" fill="#64748b">
    Variant RE-027: Bulk deletion request arriving at hour 19.5 of 20-hour SLA window
  </text>

  <!-- Actors -->
  <g id="actors">
    <!-- Access Admin -->
    <rect x="50" y="100" width="100" height="50" rx="5" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
    <text x="100" y="122" font-size="12" font-weight="bold" text-anchor="middle">Access</text>
    <text x="100" y="138" font-size="12" font-weight="bold" text-anchor="middle">Administrator</text>
    <line x1="100" y1="150" x2="100" y2="820" stroke="#374151" stroke-width="2" stroke-dasharray="5,5"/>

    <!-- Deletion Queue -->
    <rect x="200" y="100" width="100" height="50" rx="5" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
    <text x="250" y="122" font-size="12" font-weight="bold" text-anchor="middle">Deletion</text>
    <text x="250" y="138" font-size="12" font-weight="bold" text-anchor="middle">Queue</text>
    <line x1="250" y1="150" x2="250" y2="820" stroke="#374151" stroke-width="2" stroke-dasharray="5,5"/>

    <!-- Identity Store -->
    <rect x="350" y="100" width="100" height="50" rx="5" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
    <text x="400" y="122" font-size="12" font-weight="bold" text-anchor="middle">Identity</text>
    <text x="400" y="138" font-size="12" font-weight="bold" text-anchor="middle">Store</text>
    <line x1="400" y1="150" x2="400" y2="820" stroke="#374151" stroke-width="2" stroke-dasharray="5,5"/>

    <!-- Audit Log -->
    <rect x="500" y="100" width="100" height="50" rx="5" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
    <text x="550" y="122" font-size="12" font-weight="bold" text-anchor="middle">Audit</text>
    <text x="550" y="138" font-size="12" font-weight="bold" text-anchor="middle">Log</text>
    <line x1="550" y1="150" x2="550" y2="820" stroke="#374151" stroke-width="2" stroke-dasharray="5,5"/>

    <!-- Session Manager -->
    <rect x="650" y="100" width="100" height="50" rx="5" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
    <text x="700" y="122" font-size="12" font-weight="bold" text-anchor="middle">Session</text>
    <text x="700" y="138" font-size="12" font-weight="bold" text-anchor="middle">Manager</text>
    <line x1="700" y1="150" x2="700" y2="820" stroke="#374151" stroke-width="2" stroke-dasharray="5,5"/>

    <!-- Escalation Subsystem -->
    <rect x="800" y="100" width="100" height="50" rx="5" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
    <text x="850" y="118" font-size="12" font-weight="bold" text-anchor="middle">Escalation</text>
    <text x="850" y="134" font-size="12" font-weight="bold" text-anchor="middle">Subsystem</text>
    <line x1="850" y1="150" x2="850" y2="820" stroke="#374151" stroke-width="2" stroke-dasharray="5,5"/>
  </g>

  <!-- Sequence messages -->
  <g id="sequence">
    <!-- 1. Submit bulk deletion request -->
    <line x1="100" y1="200" x2="250" y2="200" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="175" y="190" font-size="11" text-anchor="middle">1: Submit bulk deletion</text>
    <text x="175" y="205" font-size="11" text-anchor="middle">request (hour 19.5)</text>

    <!-- 2. Query target user PII -->
    <line x1="250" y1="240" x2="400" y2="240" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="325" y="232" font-size="11" text-anchor="middle">2: Query target user PII</text>

    <!-- 3. Return user record -->
    <line x1="400" y1="280" x2="250" y2="280" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
    <text x="325" y="270" font-size="11" text-anchor="middle">3: Return user record +</text>
    <text x="325" y="285" font-size="11" text-anchor="middle">active sessions</text>

    <!-- 4. Revoke all active sessions -->
    <line x1="250" y1="320" x2="700" y2="320" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="475" y="310" font-size="11" text-anchor="middle">4: Revoke all active sessions</text>
    <text x="475" y="325" font-size="11" text-anchor="middle">(302 concurrent)</text>

    <!-- 5. Confirm revocation (atomic) -->
    <line x1="700" y1="360" x2="250" y2="360" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
    <text x="475" y="350" font-size="11" text-anchor="middle">5: Confirm revocation</text>
    <text x="475" y="365" font-size="11" text-anchor="middle">(atomic)</text>

    <!-- 6. Tokenize PII -->
    <line x1="250" y1="400" x2="400" y2="400" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <text x="325" y="390" font-size="11" text-anchor="middle" fill="#059669">6: Tokenize PII</text>
    <text x="325" y="405" font-size="11" text-anchor="middle" fill="#059669">(irreversible)</text>

    <!-- 7. Write audit event with surrogate key -->
    <line x1="400" y1="440" x2="550" y2="440" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <text x="475" y="430" font-size="11" text-anchor="middle" fill="#059669">7: Write audit event</text>
    <text x="475" y="445" font-size="11" text-anchor="middle" fill="#059669">with surrogate key</text>

    <!-- 8. Purge direct PII from identity store -->
    <line x1="550" y1="480" x2="400" y2="480" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <text x="475" y="470" font-size="11" text-anchor="middle" fill="#059669">8: Purge direct PII</text>
    <text x="475" y="485" font-size="11" text-anchor="middle" fill="#059669">from identity store</text>

    <!-- 9. Confirm deletion complete -->
    <line x1="400" y1="520" x2="250" y2="520" stroke="#059669" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowGreen)"/>
    <text x="325" y="510" font-size="11" text-anchor="middle" fill="#059669">9: Confirm deletion</text>
    <text x="325" y="525" font-size="11" text-anchor="middle" fill="#059669">complete</text>

    <!-- 10. Return fulfillment (within 20h) -->
    <line x1="250" y1="560" x2="100" y2="560" stroke="#059669" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowGreen)"/>
    <text x="175" y="550" font-size="11" text-anchor="middle" fill="#059669">10: Return fulfillment</text>
    <text x="175" y="565" font-size="11" text-anchor="middle" fill="#059669">(within 20h SLA)</text>
  </g>

  <!-- Failure Scenario -->
  <rect x="50" y="620" width="1100" height="170" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <text x="600" y="650" font-size="16" font-weight="bold" text-anchor="middle" fill="#dc2626">
    Failure Scenario: Request ages past 20h due to unhandled dependency deadlock
  </text>
  <text x="600" y="675" font-size="13" text-anchor="middle" fill="#7f1d1d">
    AC-01.3: Window Exceeded Boundary Case
  </text>

  <!-- Failure sequence -->
  <line x1="250" y1="710" x2="850" y2="710" stroke="#dc2626" stroke-width="3" stroke-dasharray="8,4" marker-end="url(#arrowRed)"/>
  <text x="550" y="700" font-size="12" font-weight="bold" text-anchor="middle" fill="#dc2626">
    11: Emit SLA breach alert + escalation trigger
  </text>

  <line x1="850" y1="750" x2="100" y2="750" stroke="#dc2626" stroke-width="3" stroke-dasharray="8,4" marker-end="url(#arrowRed)"/>
  <text x="475" y="740" font-size="12" font-weight="bold" text-anchor="middle" fill="#dc2626">
    12: Notify Access Admin + DPO with root-cause category
  </text>
  <text x="475" y="760" font-size="11" text-anchor="middle" fill="#7f1d1d">
    (Escalation within <= 15 min per QS-03)
  </text>

  <!-- Variant box -->
  <rect x="300" y="840" width="600" height="40" rx="8" fill="#e5e7eb" stroke="#64748b" stroke-width="2"/>
  <text x="600" y="865" font-size="14" font-weight="bold" text-anchor="middle">
    US-03 (AC-03.2): Race condition boundary under 302-user peak load with policy re-evaluation
  </text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#059669"/>
    </marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <polygon points="0 0, 12 6, 0 12" fill="#dc2626"/>
    </marker>
  </defs>
</svg>